name: Production Deployment Validation

on:
  push:
    branches: [main, dev, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:
    inputs:
      validation_level:
        description: "Validation level"
        required: true
        default: "standard"
        type: choice
        options:
          - standard
          - comprehensive
          - emergency

env:
  DENO_VERSION: "2.6.9"
  NODE_VERSION: "18"

jobs:
  production-gates:
    name: Production Readiness Gates
    runs-on: [self-hosted, universe-runners-1]
    timeout-minutes: 30

    steps:
      - name: Provide universe host tools
        uses: bitcoinuniverseio/universe-ci-actions/universe-host-tools@c9bb29ab2b39ea95dcc430fda80416deb2c4eb85
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: ${{ env.DENO_VERSION }}

      - name: Run TypeScript validation
        run: deno task check

      - name: Run security audit
        run: deno task check:imports

      - name: Upload validation report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: production-readiness-report
          path: reports/
          retention-days: 30
          if-no-files-found: ignore

  # Task 36 - Performance Benchmarking
  performance-benchmarking:
    name: Performance Benchmarking
    runs-on: [self-hosted, universe-runners-1]
    timeout-minutes: 45
    needs: [production-gates]

    steps:
      - name: Provide universe host tools
        uses: bitcoinuniverseio/universe-ci-actions/universe-host-tools@c9bb29ab2b39ea95dcc430fda80416deb2c4eb85
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: ${{ env.DENO_VERSION }}

      - name: Run performance benchmarks
        run: deno task deploy:benchmark
        env:
          DEPLOYMENT_VERSION: ${{ github.sha }}

      - name: Upload benchmark results
        uses: actions/upload-artifact@v7
        with:
          name: performance-benchmarks
          path: reports/performance-baselines.json
          retention-days: 90

      - name: Comment PR with performance results
        if: github.event_name == 'pull_request'
        continue-on-error: true
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const path = 'reports/performance-baselines.json';

            if (fs.existsSync(path)) {
              const results = JSON.parse(fs.readFileSync(path, 'utf8'));
              const latestBaseline = results[results.length - 1];

              const comment = `## 📈 Performance Benchmark Results

              **Suite Results:**
              ${latestBaseline.suites.map(suite =>
                `- **${suite.name}**: ${suite.benchmarks.length} tests, ${suite.totalDuration.toFixed(1)}ms total`
              ).join('\n')}

              **Environment:**
              - Deno Version: ${latestBaseline.metadata.denoVersion}
              - Platform: ${latestBaseline.metadata.platform}
              - Architecture: ${latestBaseline.metadata.architecture}

              View detailed results in the [benchmark artifacts](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})`;

              github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: comment
              });
            }

  # Task 37 - Cross-Module Integration Testing
  # Note: Some subtests (build-time, tree-shaking, dynamic-import) require
  # a full build environment not available in CI. Non-blocking until fixed.
  cross-module-integration:
    name: Cross-Module Integration Testing
    runs-on: [self-hosted, universe-runners-1]
    timeout-minutes: 60
    needs: [production-gates]
    continue-on-error: true

    steps:
      - name: Provide universe host tools
        uses: bitcoinuniverseio/universe-ci-actions/universe-host-tools@c9bb29ab2b39ea95dcc430fda80416deb2c4eb85
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: ${{ env.DENO_VERSION }}

      - name: Run dependency graph analysis
        run: deno task validate:dependencies

      - name: Run cross-module type compatibility tests
        run: cd tests && deno test --allow-all integration/cross-module/ --no-check
        env:
          DENO_ENV: test
          SKIP_REDIS_CONNECTION: "true"

      - name: Generate dependency visualization
        run: deno task validate:dependencies:mermaid

      - name: Upload integration test results
        uses: actions/upload-artifact@v7
        with:
          name: cross-module-integration
          path: |
            reports/cross-module-integration-*.json
            reports/dependency-analysis.json
            reports/dependency-graph.mmd
          retention-days: 30

  # Dependency Health Check
  dependency-health:
    name: Dependency Health Check
    runs-on: [self-hosted, universe-runners-1]
    timeout-minutes: 20

    steps:
      - name: Provide universe host tools
        uses: bitcoinuniverseio/universe-ci-actions/universe-host-tools@c9bb29ab2b39ea95dcc430fda80416deb2c4eb85
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: ${{ env.DENO_VERSION }}

      - name: Run dependency analysis
        run: deno task validate:dependencies

      - name: Validate client-server separation
        if: success()
        run: deno task validate:client-server

  # Rollback Testing
  rollback-testing:
    name: Rollback Procedure Testing
    runs-on: [self-hosted, universe-runners-1]
    timeout-minutes: 25
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: test
          MYSQL_DATABASE: btcstamps_test
        ports:
          - 3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-start-period=120s
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

      redis:
        image: redis:7-alpine
        ports:
          - 6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      CI: true
      DENO_ENV: development
      DB_HOST: 127.0.0.1
      DB_USER: root
      DB_PASSWORD: test
      DB_NAME: btcstamps_test
      DB_ENABLE_TLS: "false"
      SKIP_REDIS_CONNECTION: false
      QUICKNODE_API_KEY: test-quicknode-key
      # Mock external APIs for POST endpoint testing
      XCP_API_URL: http://localhost:18443/v2
      MEMPOOL_API_URL: http://localhost:18443/mempool/api
      BLOCKSTREAM_API_URL: http://localhost:18443/blockstream/api

    steps:
      - name: Provide universe host tools
        uses: bitcoinuniverseio/universe-ci-actions/universe-host-tools@c9bb29ab2b39ea95dcc430fda80416deb2c4eb85
      - name: Resolve service container ports
        # Services publish ephemeral host ports so concurrent jobs on a shared self-hosted host never collide.
        run: |
          {
            echo "DB_PORT=${{ job.services.mysql.ports['3306'] }}"
            echo "REDIS_PORT=${{ job.services.redis.ports['6379'] }}"
            echo "REDIS_URL=redis://127.0.0.1:${{ job.services.redis.ports['6379'] }}"
            echo "ELASTICACHE_ENDPOINT=127.0.0.1"
          } >> "$GITHUB_ENV"
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: ${{ env.DENO_VERSION }}

      - name: Load test schema and seed data
        run: |
          mysql -h 127.0.0.1 -P "$DB_PORT" -u root -ptest btcstamps_test < scripts/test-schema.sql
          mysql -h 127.0.0.1 -P "$DB_PORT" -u root -ptest btcstamps_test < scripts/test-seed-data.sql
          echo "✅ Test data loaded"

      - name: Start mock external API server
        run: |
          nohup deno run --allow-net --allow-env scripts/mock-external-apis.ts > mock-api-server.log 2>&1 &
          echo $! > mock-api-server.pid
          # shellcheck disable=SC2016 # the inner shell expands the exported variables
          timeout 15 bash -c 'until curl -f -s http://localhost:18443/health > /dev/null 2>&1; do
            sleep 1
          done' || { cat mock-api-server.log; exit 1; }
          echo "✅ Mock API server ready at http://localhost:18443"

      - name: Cache and start dev server
        run: |
          deno cache --no-check main.ts dev.ts
          nohup deno run -A dev.ts > dev-server.log 2>&1 &
          echo $! > dev-server.pid
          # shellcheck disable=SC2016 # the inner shell expands the exported variables
          timeout 300 bash -c 'until curl -f -s http://localhost:8000/api/v2/health > /dev/null 2>&1; do
            sleep 2
          done' || { cat dev-server.log; exit 1; }
          echo "✅ Dev server ready at http://localhost:8000"

      - name: Test rollback procedures in staging
        run: deno task deploy:rollback:test

      - name: Validate rollback health checks
        run: deno task deploy:rollback:check
        env:
          BASE_URL: http://localhost:8000

      - name: Upload rollback test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: rollback-test-results
          path: reports/rollback-*.json
          retention-days: 30

  # Security and Compliance
  security-validation:
    name: Security Validation
    runs-on: [self-hosted, universe-runners-1]
    timeout-minutes: 15

    steps:
      - name: Provide universe host tools
        uses: bitcoinuniverseio/universe-ci-actions/universe-host-tools@c9bb29ab2b39ea95dcc430fda80416deb2c4eb85
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: ${{ env.DENO_VERSION }}

      - name: Run security checks
        run: |
          deno task check:imports
          deno task check:ssr

      - name: Check for hardcoded secrets
        run: |
          # Check for potential hardcoded secrets (targeting actual secret patterns)
          if grep -r -E "password\s*[=:]\s*[\"'].*[\"']|secret\s*[=:]\s*[\"'].*[\"']|api[_-]?key\s*[=:]\s*[\"'].*[\"']|private[_-]?key\s*[=:]\s*[\"'].*[\"']" --include="*.ts" --include="*.tsx" --exclude-dir=node_modules --exclude-dir=_fresh . | grep -v "\.d\.ts" | grep -v test; then
            echo "❌ Potential hardcoded secrets found"
            exit 1
          fi

      - name: Validate environment security
        run: |
          # Check for .env files in repository
          if find . -name ".env*" -not -path "./.env.example" -not -path "./.env.template" -not -path "./.env.sample" -not -name "*.enc" | grep -q .; then
            echo "❌ Environment files found in repository"
            exit 1
          fi

  # Comprehensive Validation (for main branch)
  comprehensive-validation:
    name: Comprehensive Validation
    runs-on: [self-hosted, universe-runners-1]
    timeout-minutes: 90
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs:
      [
        production-gates,
        performance-benchmarking,
        cross-module-integration,
        dependency-health,
        rollback-testing,
        security-validation,
      ]

    steps:
      - name: Provide universe host tools
        uses: bitcoinuniverseio/universe-ci-actions/universe-host-tools@c9bb29ab2b39ea95dcc430fda80416deb2c4eb85
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: ${{ env.DENO_VERSION }}

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts/

      - name: Run comprehensive validation suite
        run: |
          echo "🚀 Running comprehensive production validation..."

          # Combine all validation results
          mkdir -p reports/comprehensive/
          cp artifacts/**/*.json reports/comprehensive/ 2>/dev/null || true

          # Generate comprehensive report
          deno run --allow-all scripts/deployment/generate-comprehensive-report.ts

      - name: Upload comprehensive report
        uses: actions/upload-artifact@v7
        with:
          name: comprehensive-validation-report
          path: reports/comprehensive/
          retention-days: 90

      - name: Create deployment summary
        run: |
          echo "## 🎯 Production Validation Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ All validation gates passed successfully" >> $GITHUB_STEP_SUMMARY
          echo "✅ Performance benchmarks within acceptable limits" >> $GITHUB_STEP_SUMMARY
          echo "✅ Cross-module integration validated" >> $GITHUB_STEP_SUMMARY
          echo "✅ Dependency health score acceptable" >> $GITHUB_STEP_SUMMARY
          echo "✅ Rollback procedures tested and verified" >> $GITHUB_STEP_SUMMARY
          echo "✅ Security validation completed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "🚀 **Ready for production deployment**" >> $GITHUB_STEP_SUMMARY

  # Notification on failure
  notify-failure:
    name: Notify on Failure
    runs-on: [self-hosted, universe-runners-1]
    if: failure()
    needs:
      [
        production-gates,
        performance-benchmarking,
        cross-module-integration,
        dependency-health,
        rollback-testing,
        security-validation,
      ]

    steps:
      - name: Provide universe host tools
        uses: bitcoinuniverseio/universe-ci-actions/universe-host-tools@c9bb29ab2b39ea95dcc430fda80416deb2c4eb85
      - name: Create failure summary
        run: |
          echo "## ❌ Production Validation Failed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "One or more validation steps failed. Please check the job logs for details." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Failed Jobs:**" >> $GITHUB_STEP_SUMMARY
          echo "- Check individual job status above" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "🚫 **Deployment blocked until issues are resolved**" >> $GITHUB_STEP_SUMMARY
