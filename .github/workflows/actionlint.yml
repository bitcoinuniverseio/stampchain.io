name: Actionlint
on:
  push:
  pull_request:

permissions:
  contents: read
  pull-requests: write
  checks: write

jobs:
  actionlint:
    runs-on: [self-hosted, Linux, X64, universe]
    steps:
      - uses: actions/checkout@v7
      - uses: reviewdog/action-actionlint@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          reporter: github-pr-check
          filter_mode: added
          fail_on_error: false

