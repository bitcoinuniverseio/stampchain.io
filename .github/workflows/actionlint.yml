name: Actionlint
on:
  push:
  pull_request:

jobs:
  actionlint:
    runs-on: [self-hosted, linux, x64, universe-super]
    steps:
      - uses: actions/checkout@v7
      - uses: reviewdog/action-actionlint@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          reporter: github-pr-review

