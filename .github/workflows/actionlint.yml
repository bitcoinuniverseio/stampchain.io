name: Actionlint
on:
  push:
  pull_request:

jobs:
  actionlint:
    runs-on: [self-hosted, universe-ci]
    steps:
      - uses: actions/checkout@v6
      - uses: reviewdog/action-actionlint@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          reporter: github-pr-review

