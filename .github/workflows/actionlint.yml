name: Actionlint
on:
  push:
  pull_request:

jobs:
  route:
    uses: bitcoinuniverseio/.github-private/.github/workflows/route.yml@develop
    secrets: inherit
    with:
      plan: '{"actionlint":"light"}'

  actionlint:
    needs: route
    runs-on: ${{ fromJSON(needs.route.outputs.targets).actionlint }}
    steps:
      - uses: actions/checkout@v6
      - uses: reviewdog/action-actionlint@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          reporter: github-pr-review

