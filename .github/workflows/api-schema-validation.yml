name: API Schema Validation

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'routes/api/**'
      - 'server/services/**'
      - 'static/swagger/**'
      - '.redocly.yaml'

jobs:
  validate-schema:
    runs-on: [self-hosted, linux, x64, universe-super]
    timeout-minutes: 5
    
    steps:
      - uses: actions/checkout@v7
      
      - uses: bitcoinuniverseio/universe-ci-actions/universe-node-env@8e24bc760556caa5ec8c7c497baaad2e9adcc912
      - name: Validate OpenAPI Schema
        run: |
          echo "🔍 Validating OpenAPI specification..."
          npx @redocly/cli@latest lint ./schema.yml --config .redocly.yaml --format stylish
          
      - name: Check for breaking changes
        if: github.event_name == 'pull_request'
        continue-on-error: true
        run: |
          echo "📊 Checking for breaking changes..."
          # Fetch the base branch to compare against
          git fetch origin ${{ github.base_ref }}
          
          # Use oasdiff to check for breaking changes
          npx oasdiff@latest breaking \
            --base origin/${{ github.base_ref }}:schema.yml \
            --revision HEAD:schema.yml \
            --format text || true
